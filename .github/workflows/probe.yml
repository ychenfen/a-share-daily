name: probe

# 临时诊断用，验证完就删。不写任何文件，只打日志。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'EOF'
          import urllib.request, time
          UA = "Mozilla/5.0"
          def get(u, label):
              try:
                  d = urllib.request.urlopen(
                      urllib.request.Request(u, headers={"User-Agent": UA}), timeout=20
                  ).read().decode()
                  print("  %-32s OK  len=%d" % (label, len(d)))
                  return True
              except Exception as e:
                  print("  %-32s FAIL %s" % (label, type(e).__name__))
                  return False

          C = "https://push2.eastmoney.com/api/qt/clist/get?"
          VARIANTS = [
            ("A 含f62 不带f:!50(当前)", "pn=1&pz=5&po=1&np=1&fltt=2&fid=f3&fs=m:90+t:2&fields=f3,f12,f14,f62,f128"),
            ("B 含f62 带f:!50",        "pn=1&pz=5&po=1&np=1&fltt=2&fid=f3&fields=f3,f12,f14,f62,f128&fs=m:90+t:2+f:!50"),
            ("C 不含f62",              "pn=1&pz=5&po=1&np=1&fltt=2&fid=f3&fs=m:90+t:2&fields=f3,f12,f14"),
            ("D 升序 po=0",            "pn=1&pz=5&po=0&np=1&fltt=2&fid=f3&fields=f3,f12,f14,f62,f128&fs=m:90+t:2+f:!50"),
          ]

          print("== 第一轮：干净状态，直接打板块（间隔1.5s）==")
          for label, qs in VARIANTS:
              get(C + qs, label); time.sleep(1.5)

          print("== 第二轮：先走一遍 snapshot 的请求序列，再打板块 ==")
          get("https://qt.gtimg.cn/q=sh000001,sz399001", "腾讯指数"); time.sleep(1.5)
          get("https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=1.000001,0.399001,0.899050&fields=f12,f104,f105,f106", "ulist.np 涨跌家数"); time.sleep(1.5)
          for kind, sort in (("ZT","fbt%3Aasc"),("DT","fund%3Aasc"),("ZB","fbt%3Aasc")):
              get("http://push2ex.eastmoney.com/getTopic%sPool?ut=7eea3edcaed734bea9cbfc24409ed989&dpt=wz.ztzt&Pageindex=0&pagesize=300&sort=%s&date=20260918" % (kind, sort), "push2ex %s池" % kind)
              time.sleep(1.5)
          for label, qs in VARIANTS:
              get(C + qs, "序列后 " + label); time.sleep(1.5)
          EOF
