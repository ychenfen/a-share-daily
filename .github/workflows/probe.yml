name: probe

# 临时诊断用，验证完就删。不写任何文件，只打日志。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'EOF'
          import urllib.request, time
          UA = "Mozilla/5.0"
          BASE = "https://push2.eastmoney.com/api/qt/clist/get"
          def t(label, qs):
              u = BASE + "?" + qs
              try:
                  d = urllib.request.urlopen(
                      urllib.request.Request(u, headers={"User-Agent": UA}), timeout=20
                  ).read().decode()
                  print("%-28s len=%-6d %s" % (label, len(d), d[:150]))
              except Exception as e:
                  print("%-28s FAIL %s" % (label, type(e).__name__))
              time.sleep(1.5)

          common = "pn=1&pz=5&po=1&np=1&fltt=2&fid=f3&fields=f3,f12,f14"
          t("行业 m:90+t:2",        common + "&fs=m:90+t:2")
          t("行业 m:90+t:2+f:!50",  common + "&fs=m:90+t:2+f:!50")
          t("行业 %20 分隔",        common + "&fs=m:90%20t:2%20f:!50")
          t("行业 无np",            "pn=1&pz=5&po=1&fltt=2&fid=f3&fields=f3,f12,f14&fs=m:90+t:2")
          t("概念 m:90+t:3",        common + "&fs=m:90+t:3")
          t("个股 m:0+t:6",         common + "&fs=m:0+t:6")
          t("含f62资金字段",         "pn=1&pz=5&po=1&np=1&fltt=2&fid=f3&fields=f3,f12,f14,f62,f128&fs=m:90+t:2+f:!50")
          EOF
