name: A-share market pulse

on:
  schedule:
    # UTC -> 北京时间：10:05 / 11:35 / 15:10 / 20:20。
    # 交易日留下四段真实市场脉搏，休市日刷新可观测状态。
    - cron: "5 2 * * *"
    - cron: "35 3 * * *"
    - cron: "10 7 * * *"
    - cron: "20 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "手动补某天的数据（YYYY-MM-DD，留空=今天）"
        required: false
        default: ""
      slot:
        description: "运行时段（auto 会按北京时间判断）"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - open
          - midday
          - close
          - night

# 默认的 GITHUB_TOKEN 是只读的，要写回仓库必须显式开
permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 不装 setup-python：runner 自带的 python3 是 3.12，
      # 脚本只用标准库，省掉三十秒安装时间
      - name: 抓取市场脉搏
        id: pulse
        env:
          SNAPSHOT_DATE: ${{ inputs.date }}
          SNAPSHOT_SLOT: ${{ inputs.slot || github.event.schedule || 'auto' }}
        run: python3 scripts/snapshot.py

      - name: 生成走势图
        run: python3 scripts/chart.py

      - name: 数据质量门禁
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate.py

      - name: 提交
        env:
          GIT_NAME: ychenfen
          GIT_EMAIL: 146975478+ychenfen@users.noreply.github.com
          SLOT_LABEL: ${{ steps.pulse.outputs.slot_label }}
        run: |
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git add -A
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(pulse): $(TZ=Asia/Shanghai date +%Y-%m-%d) ${SLOT_LABEL:-市场更新}"
          git push || (git pull --rebase && git push)
