name: A-share market pulse

on:
  schedule:
    # UTC -> 北京时间：06:15 / 10:05 / 11:35 / 15:10 / 20:20。
    # 清晨补充美股收盘与全球新闻，交易日留下四段 A 股脉搏。
    - cron: "15 22 * * *"
    - cron: "5 2 * * *"
    - cron: "35 3 * * *"
    - cron: "10 7 * * *"
    - cron: "20 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "手动补某天的数据（YYYY-MM-DD，留空=今天）"
        required: false
        default: ""
      slot:
        description: "运行时段（auto 会按北京时间判断）"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - overnight
          - open
          - midday
          - close
          - night

# 默认的 GITHUB_TOKEN 是只读的，要写回仓库必须显式开
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 不装 setup-python：runner 自带的 python3 是 3.12，
      # 脚本只用标准库，省掉三十秒安装时间
      - name: 抓取市场脉搏
        id: pulse
        env:
          SNAPSHOT_DATE: ${{ inputs.date }}
          SNAPSHOT_SLOT: ${{ inputs.slot || github.event.schedule || 'auto' }}
        run: python3 scripts/snapshot.py

      - name: 更新全球市场与新闻分析
        run: python3 scripts/global_context.py

      - name: 结算前向信号成绩
        run: python3 scripts/scorecard.py

      - name: 生成走势图
        run: python3 scripts/chart.py

      - name: 数据质量门禁
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/validate.py

      - name: 提交
        env:
          GIT_NAME: ychenfen
          GIT_EMAIL: 146975478+ychenfen@users.noreply.github.com
          SLOT_LABEL: ${{ steps.pulse.outputs.slot_label }}
        run: |
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git add -A
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(pulse): $(TZ=Asia/Shanghai date +%Y-%m-%d) ${SLOT_LABEL:-市场更新}"
          git push || (git pull --rebase && git push)

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Build dashboard with the committed market update
        run: python3 scripts/build_site.py --output public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy updated dashboard
        id: deployment
        uses: actions/deploy-pages@v4
