name: 数据或程序问题
description: 报告抓取、生成、展示或自动任务中的可复现问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢报告。请勿粘贴 Token、Cookie 或其他凭据。
  - type: input
    id: time
    attributes:
      label: 发生时间
      description: 请注明北京时间和对应的自动更新时段。
      placeholder: 2026-09-20 15:10 收盘快照
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - A股行情或情绪
        - 全球市场或宏观数据
        - 新闻雷达或风险评分
        - 前向成绩单
        - GitHub Pages 页面
        - GitHub Actions
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 提供可公开的错误信息、字段或截图。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我确认内容不含凭据或个人敏感信息
          required: true
        - label: 我已经搜索过现有 Issues
          required: true
