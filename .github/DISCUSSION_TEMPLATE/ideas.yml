title: "[Idea] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢你一起改进 A-Share Pulse。这里适合讨论尚未定型的信号、数据源和可视化想法；可复现的错误请提交 Issue。
  - type: input
    id: source
    attributes:
      label: 数据或灵感来源
      description: 如果涉及外部数据，请附公开文档或接口链接。
      placeholder: https://...
  - type: textarea
    id: idea
    attributes:
      label: 想解决什么问题
      description: 请描述用户场景，以及现有页面或数据为什么还不够。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据链与验证方法
      description: 信号如何影响 A 股、什么情况下失效、怎样避免未来函数或选择偏差？
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 研究边界
      options:
        - label: 这个想法不包含个性化买卖建议或收益承诺
          required: true
        - label: 我愿意区分事实、推断和待验证假设
          required: true
